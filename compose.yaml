services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: cinema-postgres
    environment:
      - 'POSTGRES_DB=cinema_db'
      - 'POSTGRES_USER=adminCinema@login'
      - 'POSTGRES_PASSWORD=adminCinema@Password'
    ports:
      - '5433:5432'
  rabbitmq:
    image: 'rabbitmq:3.13-management-alpine'
    container_name: cinema-rabbitmq
    environment:
      - 'RABBITMQ_DEFAULT_USER=guestCinema@user'
      - 'RABBITMQ_DEFAULT_PASS=guestCinema@pass'
    ports:
      - '5672:5672'
      - '15672:15672'
