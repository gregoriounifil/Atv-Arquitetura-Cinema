spring:
  application:
    name: cinema-api
  datasource:
    url: jdbc:postgresql://localhost:5432/cinema_db
    username: cinema_user
    password: cinema_password
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # PROIBIDO usar update. Quem manda no banco é o Flyway.
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true # Ativa Virtual Threads do Java 21 para alta concorrência na compra de assentos