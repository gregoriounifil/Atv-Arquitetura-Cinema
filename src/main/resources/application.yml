spring:
  application:
    name: cinema-api
  datasource:
    url: jdbc:postgresql://localhost:5433/cinema_db
    username: adminCinema@login
    password: adminCinema@Password
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # PROIBIDO usar update. Quem manda no banco é o Flyway.
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: guestCinema@user
    password: guestCinema@pass
  thymeleaf:
    cache: false
  threads:
    virtual:
      enabled: true # Ativa Virtual Threads do Java 21 para alta concorrência na compra de assentos

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true
    tryItOutEnabled: true
